# Free web compute only. PostgreSQL is supplied by a separate Supabase Free project.
# Never add a disk or change the plan without explicit approval.
services:
  - type: web
    name: hokse-study
    runtime: docker
    repo: https://github.com/David-Liv/Web-Education-
    branch: main
    region: frankfurt
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/auth/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "3001"
      - key: HOKSE_STATIC_DIR
        value: /app/dist-pilot
      - key: DATABASE_URL
        sync: false
      - key: HOKSE_ENCRYPTION_KEY
        sync: false
      - key: HOKSE_ALLOW_SETUP
        value: "false"
      - key: HOKSE_SECURE_COOKIE
        value: "true"
