name: HOKSE checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hokse-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/check-secrets.mjs --history
      - run: node --test scripts/security.check.mjs

  app:
    name: Tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:server
      - run: pnpm build:pilot
      - name: Generated API contract must be committed
        run: git diff --exit-code -- public/openapi-pilot.json

  postgres:
    name: Isolated PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:postgres

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        id: analyze
        with:
          category: /language:javascript-typescript
          upload-database: false
      - name: Block high or critical findings
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: node scripts/check-codeql-results.mjs "$SARIF_DIRECTORY"

  ready:
    name: Release readiness
    if: ${{ always() }}
    needs: [secrets, app, postgres, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every required job must succeed
        env:
          SECRETS: ${{ needs.secrets.result }}
          APP: ${{ needs.app.result }}
          POSTGRES: ${{ needs.postgres.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$SECRETS" = success
          test "$APP" = success
          test "$POSTGRES" = success
          test "$CODEQL" = success
